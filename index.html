<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Online Admissions portal for applications, courses, and programs.">
  <title>Online Admissions</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #1e293b;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 1.25rem 2rem;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header .logo {
      font-weight: 700;
      font-size: 1.25rem;
      color: #2563eb;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.5rem;
    }

    .hero-card {
      max-width: 600px;
      background: #ffffff;
      padding: 3rem 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 800;
      margin-bottom: 1rem;
      color: #0f172a;
    }

    p {
      color: #64748b;
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .cta-btn {
      display: inline-block;
      background-color: #2563eb;
      color: #ffffff;
      text-decoration: none;
      padding: 0.85rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      transition: background-color 0.2s ease;
    }

    .cta-btn:hover {
      background-color: #1d4ed8;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.875rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Online Admissions</div>
  </header>

  <main>
    <div class="hero-card">
      <h1>Admissions Open for 2026</h1>
      <p>Start your application today. Select your course, upload your documents, and complete your registration seamlessly online.</p>
      <a href="#apply" class="cta-btn">Apply Now</a>
    </div>
  </main>

  <footer>
    &copy; 2026 Online Admissions. All rights reserved.
  </footer>

</body>
</html>
